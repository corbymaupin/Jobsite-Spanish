<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Jobsite Spanish</title>
<style>
  :root {
    --concrete:   #E8E6E1;
    --card:       #FFFFFF;
    --ink:        #16181D;
    --muted:      #6B6F76;
    --hairline:   #CFCCC5;
    --vial:       #FFC400;
    --got-it:     #1F7A4D;
    --missed:     #B3261E;

    --step-0: 0.8125rem;
    --step-1: 1rem;
    --step-2: 1.375rem;
    --step-3: 2.5rem;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0; padding: 0;
    background: var(--concrete);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    font-size: var(--step-1);
    line-height: 1.45;
    -webkit-text-size-adjust: 100%;
  }

  .wrap { max-width: 34rem; margin: 0 auto; padding: 1.25rem 1.125rem 3rem; }

  .masthead {
    display: flex; align-items: baseline; justify-content: space-between;
    gap: 1rem; padding-bottom: 0.75rem; border-bottom: 2px solid var(--ink);
  }
  .masthead h1 { margin: 0; font-size: var(--step-2); font-weight: 800; letter-spacing: -0.02em; }
  .masthead .count { font-size: var(--step-0); color: var(--muted); font-variant-numeric: tabular-nums; }

  /* Five bars, one per Leitner box. Left is what you keep missing,
     right is what you know cold. Weight shifting right over weeks
     is the only progress signal that matters here. */
  .gauge {
    display: grid; grid-template-columns: repeat(5, 1fr); gap: 0.375rem;
    margin: 1.25rem 0 1.5rem; align-items: end; height: 4.5rem;
  }
  .gauge-col { display: flex; flex-direction: column; justify-content: flex-end; height: 100%; text-align: center; }
  .gauge-bar { background: var(--ink); border-radius: 2px 2px 0 0; min-height: 3px; transition: height 200ms ease; }
  .gauge-col:nth-child(5) .gauge-bar { background: var(--got-it); }
  .gauge-n { font-size: 0.6875rem; color: var(--muted); padding-top: 0.3125rem; font-variant-numeric: tabular-nums; }

  /* Trade filter. With 240 terms you rarely want the whole deck at
     once, and drilling one trade before a specific day's work is
     more useful than a random shuffle across everything. */
  .filter { display: flex; flex-wrap: wrap; gap: 0.375rem; margin-bottom: 1.25rem; }
  .chip {
    width: auto; padding: 0.4375rem 0.75rem; font-size: 0.8125rem; font-weight: 600;
    background: transparent; color: var(--muted);
    border: 1px solid var(--hairline); border-radius: 999px;
  }
  .chip.active { background: var(--ink); color: #fff; border-color: var(--ink); }
  .chip .n { opacity: 0.6; font-variant-numeric: tabular-nums; }

  .card {
    background: var(--card); border: 1px solid var(--hairline);
    border-top: 4px solid var(--ink); padding: 2rem 1.375rem; text-align: center;
  }
  .card.is-phrase { border-top-color: var(--vial); }

  .term { font-size: var(--step-3); font-weight: 800; letter-spacing: -0.03em; line-height: 1.12; margin: 0; word-wrap: break-word; }
  .term.long { font-size: 1.625rem; letter-spacing: -0.02em; }
  .side-note { font-size: var(--step-0); color: var(--muted); margin: 0.625rem 0 0; }

  .answer { margin-top: 1.5rem; padding-top: 1.5rem; border-top: 1px dashed var(--hairline); }
  .regional { font-size: var(--step-0); color: var(--muted); margin: 0.75rem 0 0; font-style: italic; }

  button { font: inherit; font-weight: 700; border: none; border-radius: 4px; padding: 1.0625rem 1.25rem; width: 100%; cursor: pointer; -webkit-tap-highlight-color: transparent; }
  button:focus-visible { outline: 3px solid var(--ink); outline-offset: 2px; }

  .btn-primary { background: var(--vial); color: var(--ink); }
  .btn-flip    { background: var(--ink); color: #fff; margin-top: 1.75rem; }
  .btn-quiet   { background: transparent; color: var(--muted); font-weight: 600; border: 1px solid var(--hairline); padding: 0.75rem; }

  .verdict { display: grid; grid-template-columns: 1fr 1fr; gap: 0.625rem; margin-top: 1.75rem; }
  .btn-missed { background: var(--missed); color: #fff; }
  .btn-got-it { background: var(--got-it); color: #fff; }

  .speak-btn {
    display: inline-flex; align-items: center; gap: 0.4375rem; width: auto;
    margin: 0.875rem auto 0; padding: 0.5rem 0.9375rem;
    background: transparent; color: var(--ink);
    border: 1px solid var(--hairline); border-radius: 999px;
    font-size: 0.8125rem; font-weight: 600;
  }
  .speak-btn:active { background: var(--concrete); }
  .speak-btn.speaking { background: var(--ink); color: #fff; border-color: var(--ink); }
  .speak-btn svg { flex-shrink: 0; }

  .voice-note { font-size: 0.75rem; color: var(--muted); text-align: center; margin: 0.875rem 0 0; line-height: 1.4; }

  .new-flag {
    display: inline-block; font-size: 0.6875rem; font-weight: 700;
    background: var(--vial); color: var(--ink);
    padding: 0.1875rem 0.5rem; border-radius: 3px; margin-bottom: 0.875rem;
  }

  .stack > * + * { margin-top: 0.75rem; }
  .spacer { height: 1.75rem; }

  .progress { font-size: var(--step-0); color: var(--muted); text-align: center; margin-bottom: 0.875rem; font-variant-numeric: tabular-nums; }
  .empty { text-align: center; padding: 2rem 1rem; }
  .empty p { color: var(--muted); margin: 0.5rem 0 0; }
  .hidden { display: none; }

  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<div class="wrap">

  <div class="masthead">
    <h1>Jobsite Spanish</h1>
    <span class="count" id="totalCount"></span>
  </div>

  <div class="gauge" id="gauge"></div>

  <section id="homeScreen">
    <div class="filter" id="filter"></div>
    <div id="homeBody"></div>
  </section>

  <section id="studyScreen" class="hidden">
    <p class="progress" id="progress"></p>
    <div class="card" id="studyCard">
      <span class="new-flag hidden" id="newFlag">New</span>
      <p class="term" id="prompt"></p>

      <button class="speak-btn hidden" id="promptSpeak" type="button">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M11 5 6 9H2v6h4l5 4V5z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M19 5a9 9 0 0 1 0 14"/>
        </svg>
        Hear it
      </button>

      <p class="side-note" id="promptNote"></p>

      <div class="answer hidden" id="answerBlock">
        <p class="term" id="answer"></p>
        <button class="speak-btn hidden" id="answerSpeak" type="button">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor"
               stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M11 5 6 9H2v6h4l5 4V5z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M19 5a9 9 0 0 1 0 14"/>
          </svg>
          Hear it
        </button>
        <p class="regional hidden" id="regional"></p>
      </div>
    </div>

    <p class="voice-note hidden" id="voiceNote"></p>

    <button class="btn-flip" id="flipBtn">Show answer</button>

    <div class="verdict hidden" id="verdict">
      <button class="btn-missed" id="missedBtn">Missed it</button>
      <button class="btn-got-it" id="gotItBtn">Got it</button>
    </div>

    <div class="spacer"></div>
    <button class="btn-quiet" id="endBtn">End session</button>
  </section>

  <section id="doneScreen" class="hidden">
    <div class="card">
      <p class="term">Deck clear</p>
      <p class="side-note" id="doneSummary"></p>
    </div>
    <div class="spacer"></div>
    <button class="btn-primary" id="backBtn">Back to start</button>
  </section>

</div>

     form. Usted is the respectful register, and it's what you want
     coming from a supervisor to a crew. Using tu forms to grown men
     you've just met reads as talking down to them.

/* =================================================================
   2. DATES

   Everything uses a plain "YYYY-MM-DD" string instead of a Date
   object. Two reasons, both learned the hard way:

   - Date objects carry a time of day. A card reviewed at 11pm and
     one reviewed at 6am compare differently even though both
     happened "today". Dropping the time removes that whole class
     of bug.
   - "YYYY-MM-DD" strings compare correctly with plain < and >,
     because the digits run largest-unit-first. "2026-03-09" is
     less than "2026-03-10", and that's all this app ever needs.
   ================================================================= */

function todayKey() {
  const now = new Date();
  const year = now.getFullYear();
  const month = String(now.getMonth() + 1).padStart(2, "0");  // getMonth() is zero-based
  const day = String(now.getDate()).padStart(2, "0");
  return year + "-" + month + "-" + day;
}

function addDays(dateKey, days) {
  // Split the string apart rather than letting Date parse it, which
  // avoids the timezone trap where "2026-03-09" is read as UTC
  // midnight and lands on the 8th in Texas.
  const parts = dateKey.split("-");
  const d = new Date(Number(parts[0]), Number(parts[1]) - 1, Number(parts[2]));
  d.setDate(d.getDate() + days);
  const year = d.getFullYear();
  const month = String(d.getMonth() + 1).padStart(2, "0");
  const day = String(d.getDate()).padStart(2, "0");
  return year + "-" + month + "-" + day;
}


/* =================================================================
   3. LEITNER BOXES AND PACING

   Box 1 is the pile you keep missing; box 5 is the pile you know
   cold. Right answer moves a card up one box and pushes the next
   review further out. Wrong answer drops it straight back to box 1.
   Intervals double because forgetting isn't linear: once a word has
   survived a week, it usually survives two.

   NEW_PER_DAY is the important number. There are 250 terms in here.
   Dumping all of them into day one would give you a 250-card first
   session and you'd never open the app again. Instead the deck
   feeds you a handful of unseen cards a day on top of whatever is
   due for review, so the workload stays roughly flat. Full deck
   introduced in about three weeks.
   ================================================================= */

const BOX_INTERVALS = { 1: 1, 2: 2, 3: 4, 4: 8, 5: 16 };
const MAX_BOX = 5;
const NEW_PER_DAY = 12;

function calculateNextReview(box) {
  return addDays(todayKey(), BOX_INTERVALS[box]);
}


/* =================================================================
   4. CARD IDENTITY

   v2 gave every card `id: index` - its position in SEED_TERMS - and
   then wrote the WHOLE card, English and Spanish included, into
   localStorage. That works exactly until the day the deck changes.
   Insert one term in the middle and every id after it slides by one:

       old array:  [0] concrete  [1] cement  [2] rebar
       saved:      id 2 is in box 5 - known cold
       new array:  [0] concrete  [1] cement  [2] curing  [3] rebar
       on load:    id 2 is now "curing", and the app believes it is
                   mastered

   Nothing throws. Progress just silently re-attaches to the wrong
   words across the whole deck. This release inserts ~130 cards
   throughout the list, so that failure would have been total.

   The fix is to derive identity from something that travels WITH the
   card - its own text - instead of from where it happens to sit.
   ================================================================= */

function cardKey(term) {
  // Lowercased and whitespace-flattened so a stray double space in the
  // seed data doesn't count as a different card.
  return (term.en + "|" + term.es).toLowerCase().replace(/\s+/g, " ").trim();
}

function cardId(term) {
  // FNV-1a hash: walk the characters, XOR each into a running number,
  // multiply by a fixed prime. Math.imul does the multiply in 32-bit
  // integers, which plain * would not.
  //
  // Why hash at all, when "concrete|el concreto" is already unique?
  // Because the hash is what goes in localStorage, and the save file
  // must not contain any English or Spanish. The whole point of this
  // rewrite is that card text lives in SEED_TERMS and nowhere else:
  // fix a typo in a translation and every user gets the correction on
  // their next load. Storing the text as the key would freeze today's
  // wording into their browser permanently, which is the same trap in
  // a different shape.
  const text = cardKey(term);
  let h = 0x811c9dc5;
  for (let i = 0; i < text.length; i++) {
    h ^= text.charCodeAt(i);
    h = Math.imul(h, 0x01000193);
  }
  return (h >>> 0).toString(36);   // base 36 keeps it to ~6 characters
}


/* =================================================================
   5. THE DECK AND THE SAVE FILE

   `deck` is the live array the app works with: the text from
   SEED_TERMS plus the three fields that change (box, introduced,
   nextReview). It is rebuilt from scratch on every load.

   The save file holds ONLY those three changing fields, keyed by
   card id. That split is the whole design:

       SEED_TERMS  ->  what the words are     (ships with the app)
       localStorage ->  how well you know them (belongs to the user)

   localStorage is a small box of text the browser keeps for this
   page. It only holds strings, so state goes in as JSON and gets
   parsed back on the way out.
   ================================================================= */

const STORAGE_KEY = "jobsite-spanish-v3";
const LEGACY_KEY  = "jobsite-spanish-v2";

let deck = [];
let state = { version: 3, progress: {}, newTracker: { date: "", count: 0 } };

function buildDeck() {
  return SEED_TERMS.map(function (term) {
    // Object.assign copies the seed fields into a NEW object, so
    // SEED_TERMS itself is never modified.
    return Object.assign({}, term, {
      id: cardId(term),
      box: 1,
      introduced: false,   // hasn't been shown yet
      nextReview: null     // no schedule until it's introduced
    });
  });
}

function auditDeck() {
  // Two cards that hash to the same id would share one progress
  // record and quietly corrupt each other. The deck deliberately
  // contains homonyms - la escalera is both ladder and stairs, el
  // nivel is both the tool and the elevation - but those differ on
  // the English side, so their ids differ too. This check is here to
  // catch the day someone pastes a line twice.
  const seen = {};
  let clashes = 0;
  deck.forEach(function (card) {
    if (seen[card.id]) {
      clashes++;
      console.warn('Duplicate card id "' + card.id + '": "' + seen[card.id] +
                   '" and "' + card.en + '" would share progress.');
    }
    seen[card.id] = card.en;
  });
  return clashes;
}

function hydrateDeck() {
  // Copy saved progress onto the live deck. A card with no saved
  // record is simply untouched: box 1, not introduced. That is also
  // what a brand new card added in a future release looks like, which
  // is why nothing needs to be written for cards you've never seen.
  deck.forEach(function (card) {
    const p = state.progress[card.id];
    if (!p) return;
    card.box = p.box || 1;
    card.introduced = p.introduced === true;
    card.nextReview = p.nextReview || null;
  });
}

function save() {
  const progress = {};
  deck.forEach(function (card) {
    if (!card.introduced) return;   // nothing worth remembering yet
    progress[card.id] = {
      box: card.box,
      introduced: true,
      nextReview: card.nextReview
    };
  });
  state.progress = progress;

  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
  } catch (err) {
    // Private browsing can refuse to save. Better to keep working
    // in memory than to crash mid-session.
    console.warn("Could not save progress:", err);
  }
}

function migrateFromV2() {
  // v2 saved the entire card object, text and all. That is the bug -
  // and it is also what makes the rescue possible, because the saved
  // English and Spanish are enough to recompute the new id. Match on
  // text, carry the schedule, drop anything the deck no longer holds.
  const raw = localStorage.getItem(LEGACY_KEY);
  if (!raw) return null;

  let old;
  try { old = JSON.parse(raw); } catch (err) { return null; }
  if (!old || !Array.isArray(old.terms) || old.terms.length === 0) return null;

  const live = {};
  deck.forEach(function (card) { live[card.id] = true; });

  const progress = {};
  let carried = 0;
  let dropped = 0;

  old.terms.forEach(function (term) {
    if (!term || !term.en || !term.es) return;
    if (!term.introduced) return;         // no progress to rescue
    const id = cardId(term);
    if (!live[id]) { dropped++; return; } // retired or reworded card
    progress[id] = {
      box: term.box || 1,
      introduced: true,
      nextReview: term.nextReview || todayKey()
    };
    carried++;
  });

  console.info("Migrated v2 progress: " + carried + " cards carried, " +
               dropped + " dropped (no longer in the deck).");

  return {
    version: 3,
    progress: progress,
    newTracker: old.newTracker || { date: "", count: 0 }
  };
}

function load() {
  const saved = localStorage.getItem(STORAGE_KEY);

  if (saved) {
    try {
      const parsed = JSON.parse(saved);
      if (parsed && parsed.progress) {
        state = parsed;
        if (!state.newTracker) state.newTracker = { date: "", count: 0 };
        hydrateDeck();
        return;                            // v3 exists: never look at v2 again
      }
    } catch (err) {
      console.warn("Saved data was unreadable. Starting fresh.");
    }
  }

  const migrated = migrateFromV2();
  if (migrated) {
    state = migrated;
    hydrateDeck();
    save();                                // writing v3 makes this a one-time trip
    return;
  }

  state = { version: 3, progress: {}, newTracker: { date: "", count: 0 } };
  save();
}


/* =================================================================
   6. READING THE STATE
   ================================================================= */

function matchesFilter(term) {
  return activeTrade === "All" || term.trade === activeTrade;
}

function getTermsDue() {
  const today = todayKey();
  return deck.filter(function (term) {
    return term.introduced && term.nextReview <= today && matchesFilter(term);
  });
}

function newCardsLeftToday() {
  // Reset the counter when the date rolls over.
  if (state.newTracker.date !== todayKey()) {
    state.newTracker = { date: todayKey(), count: 0 };
  }
  return Math.max(0, NEW_PER_DAY - state.newTracker.count);
}

function getNewTerms() {
  const room = newCardsLeftToday();
  if (room === 0) return [];
  return deck.filter(function (term) {
    return !term.introduced && matchesFilter(term);
  }).slice(0, room);
}

function getBoxCounts() {
  const counts = [0, 0, 0, 0, 0];
  deck.forEach(function (term) {
    if (term.introduced) counts[term.box - 1]++;
  });
  return counts;
}

function getTrades() {
  const seen = [];
  SEED_TERMS.forEach(function (term) {
    if (seen.indexOf(term.trade) === -1) seen.push(term.trade);
  });
  return seen;
}


/* =================================================================
   7. PRONUNCIATION

   Every modern browser ships a speech engine at window.speechSynthesis.
   No library, no API key, no network call once the voice is on the
   device.

   The catch: which voices exist depends on the phone, not on this
   code. So rather than demanding one voice, rank what we want and
   take the best available.
   ================================================================= */

const TTS_SUPPORTED = "speechSynthesis" in window;

// es-MX is Mexican Spanish. es-US is the US Latino voice, close
// enough for jobsite purposes. es-419 is Latin American Spanish
// generally. Peninsular (es-ES) is last: understandable everywhere,
// but the c/z lisp isn't what a crew from Michoacán sounds like.
const VOICE_PREFERENCE = ["es-MX", "es-US", "es-419", "es-CO", "es-AR", "es-ES"];

let spanishVoice = null;

function normalizeLang(lang) {
  // Android reports "es_MX" with an underscore; everyone else uses
  // "es-MX". Flatten both to the hyphen form.
  return (lang || "").replace("_", "-");
}

function pickSpanishVoice() {
  if (!TTS_SUPPORTED) return;
  const voices = window.speechSynthesis.getVoices();
  if (voices.length === 0) return;

  for (let i = 0; i < VOICE_PREFERENCE.length; i++) {
    const match = voices.filter(function (v) {
      return normalizeLang(v.lang) === VOICE_PREFERENCE[i];
    })[0];
    if (match) { spanishVoice = match; return; }
  }

  spanishVoice = voices.filter(function (v) {
    return normalizeLang(v.lang).indexOf("es") === 0;
  })[0] || null;
}

function speakSpanish(text, button) {
  if (!TTS_SUPPORTED) return;

  // Stop anything mid-sentence. Without this, a second tap queues
  // the word up behind the first rather than replaying it.
  window.speechSynthesis.cancel();

  const utterance = new SpeechSynthesisUtterance(text);
  if (spanishVoice) {
    utterance.voice = spanishVoice;
    utterance.lang = spanishVoice.lang;
  } else {
    utterance.lang = "es-MX";
  }

  // Under normal speed. Native pace is fine once you know a word,
  // but it blurs the vowels while you're still learning it.
  utterance.rate = 0.85;

  utterance.onstart = function () { button.classList.add("speaking"); };
  utterance.onend   = function () { button.classList.remove("speaking"); };
  utterance.onerror = function () { button.classList.remove("speaking"); };

  window.speechSynthesis.speak(utterance);
}

function describeVoice() {
  if (!TTS_SUPPORTED) return "This browser has no speech engine, so audio is off.";
  if (!spanishVoice) {
    return "No Spanish voice installed. Android: Settings > Accessibility > " +
           "Text-to-speech > install Spanish (Mexico).";
  }
  const lang = normalizeLang(spanishVoice.lang);
  if (lang === "es-MX" || lang === "es-US" || lang === "es-419") return "";
  return "Using a " + lang + " voice. For Mexican Spanish, install Spanish (Mexico) " +
         "in your device's text-to-speech settings.";
}


/* =================================================================
   8. SESSION STATE
   Not saved. An interrupted session just starts over.
   ================================================================= */

let queue = [];
let current = null;
let currentDirection = "en-es";
let sessionRight = 0;
let sessionWrong = 0;
let retried = [];
let freshIds = [];   // ids introduced for the first time this session
let activeTrade = "All";


/* =================================================================
   9. SCREENS
   ================================================================= */

const el = {
  totalCount:  document.getElementById("totalCount"),
  gauge:       document.getElementById("gauge"),
  filter:      document.getElementById("filter"),
  homeScreen:  document.getElementById("homeScreen"),
  homeBody:    document.getElementById("homeBody"),
  studyScreen: document.getElementById("studyScreen"),
  doneScreen:  document.getElementById("doneScreen"),
  progress:    document.getElementById("progress"),
  studyCard:   document.getElementById("studyCard"),
  newFlag:     document.getElementById("newFlag"),
  prompt:      document.getElementById("prompt"),
  promptNote:  document.getElementById("promptNote"),
  answerBlock: document.getElementById("answerBlock"),
  answer:      document.getElementById("answer"),
  regional:    document.getElementById("regional"),
  promptSpeak: document.getElementById("promptSpeak"),
  answerSpeak: document.getElementById("answerSpeak"),
  voiceNote:   document.getElementById("voiceNote"),
  flipBtn:     document.getElementById("flipBtn"),
  verdict:     document.getElementById("verdict"),
  doneSummary: document.getElementById("doneSummary"),
  gotItBtn:    document.getElementById("gotItBtn"),
  missedBtn:   document.getElementById("missedBtn"),
  endBtn:      document.getElementById("endBtn"),
  backBtn:     document.getElementById("backBtn")
};

function showScreen(name) {
  el.homeScreen.classList.toggle("hidden", name !== "home");
  el.studyScreen.classList.toggle("hidden", name !== "study");
  el.doneScreen.classList.toggle("hidden", name !== "done");
}

function renderVoiceNote() {
  const message = describeVoice();
  el.voiceNote.textContent = message;
  el.voiceNote.classList.toggle("hidden", message === "");
}

function renderGauge() {
  const counts = getBoxCounts();
  const highest = Math.max.apply(null, counts);
  el.gauge.innerHTML = "";

  counts.forEach(function (count) {
    // Scale bars against the fullest box so the shape stays readable
    // whether you've introduced 12 terms or 250.
    const heightPercent = highest === 0 ? 0 : (count / highest) * 100;
    const col = document.createElement("div");
    col.className = "gauge-col";
    col.innerHTML =
      '<div class="gauge-bar" style="height:' + heightPercent + '%"></div>' +
      '<div class="gauge-n">' + count + "</div>";
    el.gauge.appendChild(col);
  });
}

function renderFilter() {
  const trades = ["All"].concat(getTrades());
  el.filter.innerHTML = "";

  trades.forEach(function (trade) {
    const previous = activeTrade;
    activeTrade = trade;
    const waiting = getTermsDue().length + getNewTerms().length;
    activeTrade = previous;

    const chip = document.createElement("button");
    chip.className = "chip" + (trade === activeTrade ? " active" : "");
    chip.type = "button";
    chip.innerHTML = trade + (waiting > 0 ? ' <span class="n">' + waiting + "</span>" : "");
    chip.addEventListener("click", function () {
      activeTrade = trade;
      renderHome();
    });
    el.filter.appendChild(chip);
  });
}

function renderHome() {
  const due = getTermsDue();
  const fresh = getNewTerms();
  const introduced = deck.filter(function (t) { return t.introduced; }).length;

  el.totalCount.textContent = introduced + " of " + deck.length + " started";
  renderGauge();
  renderFilter();

  const waiting = due.length + fresh.length;

  if (waiting === 0) {
    const anyLeft = deck.some(function (t) { return !t.introduced; });
    el.homeBody.innerHTML =
      '<div class="empty">' +
        '<p class="term long">Nothing due</p>' +
        "<p>" + (anyLeft
          ? "You've hit today's limit of " + NEW_PER_DAY + " new cards. More tomorrow."
          : "Every card is scheduled. Boxes 4 and 5 take longer to come back.") +
        "</p>" +
      "</div>";
  } else {
    const parts = [];
    if (due.length) parts.push(due.length + " to review");
    if (fresh.length) parts.push(fresh.length + " new");

    el.homeBody.innerHTML =
      '<div class="stack">' +
        '<p style="margin:0 0 0.25rem; color:var(--muted); font-size:0.8125rem">' +
          parts.join(", ") +
        "</p>" +
        '<button class="btn-primary" id="startBtn">Start reviewing</button>' +
      "</div>";
    document.getElementById("startBtn").addEventListener("click", startSession);
  }

  showScreen("home");
}


/* =================================================================
   10. RUNNING A SESSION
   ================================================================= */

function shuffle(array) {
  // Fisher-Yates: walk backwards, swapping each item with a random
  // earlier one. Every ordering is equally likely, which the simpler
  // sort(() => Math.random() - 0.5) trick does not actually give you.
  for (let i = array.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    const temp = array[i];
    array[i] = array[j];
    array[j] = temp;
  }
  return array;
}

function startSession() {
  const due = shuffle(getTermsDue().slice());
  const fresh = getNewTerms();

  // Mark the new ones as introduced up front and count them against
  // today's allowance, so backing out mid-session doesn't hand you
  // the same twelve cards again.
  fresh.forEach(function (term) {
    term.introduced = true;
    term.nextReview = todayKey();
  });
  freshIds = fresh.map(function (term) { return term.id; });
  state.newTracker.count += fresh.length;
  save();

  // Reviews first, then the new material. Warming up on words you've
  // already seen is easier than opening cold on twelve unknowns.
  queue = due.concat(shuffle(fresh));

  sessionRight = 0;
  sessionWrong = 0;
  retried = [];
  showScreen("study");
  nextCard();
}

function nextCard() {
  if (queue.length === 0) { finishSession(); return; }

  current = queue.shift();

  // Randomize the direction. Recognizing a word and producing it are
  // different skills, and only one of them helps when you're the one
  // giving the instruction.
  currentDirection = Math.random() < 0.5 ? "en-es" : "es-en";

  const promptText = currentDirection === "en-es" ? current.en : current.es;
  const answerText = currentDirection === "en-es" ? current.es : current.en;

  el.prompt.textContent = promptText;
  el.answer.textContent = answerText;
  el.promptNote.textContent = current.trade;

  // Full phrases need smaller type than single words or they wrap
  // into four lines on a phone.
  el.prompt.className = "term" + (promptText.length > 18 ? " long" : "");
  el.answer.className = "term" + (answerText.length > 18 ? " long" : "");
  el.studyCard.classList.toggle("is-phrase", current.trade === "Phrases");

  if (current.region) {
    el.regional.textContent = current.region;
    el.regional.classList.remove("hidden");
  } else {
    el.regional.classList.add("hidden");
  }

  // Flag only the cards being seen for the very first time, so you
  // know to read the answer rather than strain to recall it.
  el.newFlag.classList.toggle("hidden", freshIds.indexOf(current.id) === -1);

  el.answerBlock.classList.add("hidden");
  el.verdict.classList.add("hidden");
  el.flipBtn.classList.remove("hidden");

  // The speak button follows the Spanish, whichever side it's on.
  el.promptSpeak.classList.toggle("hidden", currentDirection !== "es-en" || !TTS_SUPPORTED);
  el.answerSpeak.classList.add("hidden");
  renderVoiceNote();

  const done = sessionRight + sessionWrong;
  el.progress.textContent = "Card " + (done + 1) + " of " + (done + 1 + queue.length);
}

function flip() {
  el.answerBlock.classList.remove("hidden");
  el.flipBtn.classList.add("hidden");
  el.verdict.classList.remove("hidden");

  if (currentDirection === "en-es" && TTS_SUPPORTED) {
    el.answerSpeak.classList.remove("hidden");
    // Play once automatically. You've just committed to an answer,
    // which is the moment the correct sound actually sticks.
    speakSpanish(current.es, el.answerSpeak);
  }
}

function markCorrect() {
  if (current.box < MAX_BOX) current.box++;
  current.nextReview = calculateNextReview(current.box);
  sessionRight++;
  finishCard();
}

function markWrong() {
  current.box = 1;
  current.nextReview = calculateNextReview(1);
  sessionWrong++;

  // Put a missed card back at the end of this session, but only once.
  // The second look is where it sticks; unlimited retries would trap
  // you on a single word.
  if (retried.indexOf(current.id) === -1) {
    retried.push(current.id);
    queue.push(current);
  }
  finishCard();
}

function finishCard() {
  save();
  renderGauge();
  nextCard();
}

function finishSession() {
  const total = sessionRight + sessionWrong;
  el.doneSummary.textContent = total === 0
    ? "No cards reviewed."
    : sessionRight + " right, " + sessionWrong + " missed, out of " + total + ".";
  renderGauge();
  showScreen("done");
}


/* =================================================================
   11. WIRING IT UP
   ================================================================= */

el.promptSpeak.addEventListener("click", function () { speakSpanish(current.es, el.promptSpeak); });
el.answerSpeak.addEventListener("click", function () { speakSpanish(current.es, el.answerSpeak); });
el.flipBtn.addEventListener("click", flip);
el.gotItBtn.addEventListener("click", markCorrect);
el.missedBtn.addEventListener("click", markWrong);
el.endBtn.addEventListener("click", renderHome);
el.backBtn.addEventListener("click", renderHome);

// Voices load asynchronously in Chrome, so the first getVoices()
// call usually comes back empty. The browser fires voiceschanged
// when the list is ready, which is when we get to pick properly.
if (TTS_SUPPORTED) {
  pickSpanishVoice();
  window.speechSynthesis.addEventListener("voiceschanged", function () {
    pickSpanishVoice();
    renderVoiceNote();
  });
}

deck = buildDeck();
auditDeck();
load();
renderHome();
</script>
